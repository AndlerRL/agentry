[workspace]
resolver = "2"
members = [
    "crates/agentry-core",
    "crates/agentry-agents",
    "crates/agentry-sync",
    "crates/agentry-skills",
    "crates/agentry-openclaw",
    "crates/agentry-acp",
    "crates/agentry-audit",
    "crates/agentry-harness",
    "crates/agentry-auditor",
    "crates/agentry-tui",
    "tests/integration",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
authors = ["AndlerRL <andler@andler.dev>"]
repository = "https://github.com/AndlerRL/agentry"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Async
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Git
git2 = { version = "0.19", features = ["vendored-libgit2"] }
openssl = { version = "0.10", features = ["vendored"] }

# Crypto
sha1 = "0.10"

# Versioning
semver = "1"

# Platform
dirs = "6"

# Internal crates
agentry-core = { path = "crates/agentry-core", version = "0.2.3" }
agentry-agents = { path = "crates/agentry-agents", version = "0.2.3" }
agentry-sync = { path = "crates/agentry-sync", version = "0.2.3" }
agentry-skills = { path = "crates/agentry-skills", version = "0.2.3" }
agentry-openclaw = { path = "crates/agentry-openclaw", version = "0.2.3" }
agentry-acp = { path = "crates/agentry-acp", version = "0.2.3" }
agentry-audit = { path = "crates/agentry-audit", version = "0.2.3" }
agentry-harness = { path = "crates/agentry-harness", version = "0.2.3" }
agentry-auditor = { path = "crates/agentry-auditor", version = "0.2.3" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
