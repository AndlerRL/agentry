name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Create release archive
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/agentry release/agentry-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/agentry release/agentry-x86_64-apple-darwin
          chmod +x release/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentry-release
          path: release/

  release-linux:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build Linux x86_64
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Create release archive
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-gnu/release/agentry release/agentry-x86_64-unknown-linux-gnu
          chmod +x release/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentry-release-linux
          path: release/