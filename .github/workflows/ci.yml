name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Build docs
        run: cargo doc --no-deps

  release-macos:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Add ARM64 target
        run: rustup target add aarch64-apple-darwin
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Create macOS release archives
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/agentry release/agentry-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/agentry release/agentry-x86_64-apple-darwin
          chmod +x release/*
          cd release
          tar czf agentry-macos-arm64.tar.gz agentry-aarch64-apple-darwin
          tar czf agentry-macos-x86_64.tar.gz agentry-x86_64-apple-darwin
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/agentry-macos-arm64.tar.gz
            release/agentry-macos-x86_64.tar.gz
          generate_release_notes: true

  release-linux:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build Linux x86_64
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Create Linux release archive
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-gnu/release/agentry release/agentry-x86_64-unknown-linux-gnu
          chmod +x release/*
          cd release && tar czf agentry-linux-x86_64.tar.gz agentry-*
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/agentry-linux-x86_64.tar.gz
          generate_release_notes: true